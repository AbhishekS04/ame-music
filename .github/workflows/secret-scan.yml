name: Secret scan

# Runs on every push and pull request. A failure means a credential is in the
# repository — fix it before merging, and rotate anything that was pushed.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  forbidden-files:
    name: No secret files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a secret-bearing file is tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E \
            '(^|/)(keystore\.properties|local\.properties|google-services\.json|GoogleService-Info\.plist)$|\.(jks|keystore|p12|pfx|pem|key|p8|mobileprovision|ovpn)$|(^|/)\.env($|\.)' \
            | grep -v 'keystore\.properties\.example' \
            | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Secret-bearing files are tracked:"
            printf '%s\n' "$bad"
            exit 1
          fi
          vendored=$(git ls-files | grep -E \
            '(^|/)(node_modules|build|\.cxx|\.gradle|\.kotlin|dist|logs|coverage|\.vercel|\.turbo)/' || true)
          if [ -n "$vendored" ]; then
            echo "::error::Generated/vendored files are tracked:"
            printf '%s\n' "$vendored" | head -20
            exit 1
          fi
          echo "No secret-bearing or generated files are tracked."

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
