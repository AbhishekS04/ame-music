name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./... && go test ./...
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # The Listen Together server is optional. When its deploy credentials
      # are not configured, skip the deployment instead of failing the run.
      - name: Check deployment credentials
        id: guard
        env:
          KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          HOST: ${{ secrets.ORACLE_HOST }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Oracle credentials are not configured; skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to the Oracle VM
        if: steps.guard.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          HOST: ${{ secrets.ORACLE_HOST }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is pinned to /usr/local/sbin/ame-deploy on the VM.
          ssh -i ~/.ssh/deploy deploy@"$HOST"
      - name: Health check
        env:
          # Set this repository variable to the backend's public /healthz URL,
          # e.g. https://party.example.com/healthz. Skipped when unset so a
          # deployment without a stable public URL does not fail CI.
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "BACKEND_HEALTH_URL is not set; skipping the health check."
            exit 0
          fi
          for i in $(seq 1 12); do
            curl -fsS "$HEALTH_URL" && exit 0
            sleep 5
          done
          exit 1
