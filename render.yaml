# Render blueprint for the Ame Listen Together server.
#
# Render reads blueprints from the repository root only, which is why this file
# is here rather than in backend/. Apply it with:
#   Render Dashboard -> New -> Blueprint -> connect this repository.
#
# Keep this at one instance: parties live in the memory of the process holding
# their WebSockets, so a second instance is a second, disjoint set of parties.
services:
  - type: web
    name: ame-listen-together
    runtime: go
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: JAM_MAX_MEMBERS
        value: "5"
      - key: JAM_STATE_HEARTBEAT_MS
        value: "5000"
      - key: JAM_MAX_UPCOMING_QUEUE
        value: "25"
      - key: JAM_MAX_PARTIES
        value: "50"
      - key: JAM_CREATE_RATE_PER_MINUTE
        value: "2"
      - key: JAM_CONNECTION_IDLE_MS
        value: "900000"
      # Render terminates TLS and supplies the real client IP in X-Forwarded-For.
      - key: JAM_TRUST_PROXY
        value: "true"
      # The browser player's origin. Native apps send no Origin and are always
      # accepted. Add another origin here, comma-separated, for a custom domain.
      - key: JAM_ALLOWED_ORIGINS
        value: https://ame-music.vercel.app
